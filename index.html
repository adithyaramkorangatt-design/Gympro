<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymPro - Workout Logger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1 class="logo">GYM<span>PRO</span></h1>
      <p class="subtitle">Track. Lift. Repeat.</p>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password (min 4 characters)" minlength="4" required>
        <button type="submit" class="btn primary full">Sign In / Create Account</button>
        <p id="loginError" class="error"></p>
      </form>
    </div>
  </section>

  <!-- MAIN APP -->
  <main id="app" class="app hidden">
    <header class="topbar">
      <div>
        <h2 id="greeting">Welcome</h2>
        <p id="dateText" class="muted"></p>
      </div>
      <div class="top-right">
        <div id="clock" class="clock">00:00:00</div>
        <button id="themeToggle" class="btn ghost">🌙 Theme</button>
        <button id="logoutBtn" class="btn ghost">Logout</button>
      </div>
    </header>

    <div class="grid">

      <!-- Water -->
      <article class="card">
        <h3>💧 Water Intake</h3>
        <div class="progress"><div id="waterBar" class="progress-fill"></div></div>
        <p id="waterText" class="muted"></p>
        <div class="row">
          <button class="btn" data-water="250">+250 ml</button>
          <button class="btn" data-water="500">+500 ml</button>
          <button id="waterReset" class="btn ghost">Reset</button>
        </div>
      </article>

      <!-- Stats -->
      <article class="card">
        <h3>📊 Stats</h3>
        <div class="stats">
          <div><span id="statWorkouts">0</span><small>Workouts</small></div>
          <div><span id="statVolume">0</span><small>Total kg lifted</small></div>
          <div><span id="statStreak">0</span><small>Day streak</small></div>
        </div>
        <button id="checkinBtn" class="btn primary full">✅ Check In at Gym</button>
        <p id="checkinText" class="muted small"></p>
      </article>

      <!-- Rest timer -->
      <article class="card">
        <h3>⏱ Rest Timer</h3>
        <div id="timerDisplay" class="timer">01:00</div>
        <div class="row">
          <select id="timerPreset">
            <option value="60">60 sec</option>
            <option value="90">90 sec</option>
            <option value="120">2 min</option>
            <option value="180">3 min</option>
          </select>
        </div>
        <div class="row">
          <button id="timerStart" class="btn primary">Start</button>
          <button id="timerStop" class="btn ghost">Pause</button>
          <button id="timerReset" class="btn ghost">Reset</button>
        </div>
      </article>

      <!-- Quote -->
      <article class="card">
        <h3>🔥 Motivation</h3>
        <p id="quoteText" class="quote"></p>
        <button id="newQuote" class="btn ghost">New Quote</button>
      </article>

      <!-- Workout logger (full width) -->
      <article class="card wide">
        <h3>🏋️ Workout Logger</h3>
        <form id="workoutForm" class="form-grid">
          <input type="text" id="exercise" placeholder="Exercise (e.g. Bench Press)" required>
          <input type="date" id="workoutDate" required>
          <input type="number" id="sets" placeholder="Sets" min="1" required>
          <input type="number" id="reps" placeholder="Reps" min="1" required>
          <input type="number" id="weight" placeholder="Weight (kg)" min="0" step="0.5" required>
          <button type="submit" class="btn primary">Add Workout</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Exercise</th><th>Sets</th><th>Reps</th><th>Weight</th><th>Volume</th><th></th></tr>
            </thead>
            <tbody id="workoutList"></tbody>
          </table>
        </div>
      </article>

      <!-- Macros -->
      <article class="card">
        <h3>🥗 Macro Tracker</h3>
        <form id="macroForm" class="form-stack">
          <input type="number" id="protein" placeholder="Protein (g)" min="0" required>
          <input type="number" id="carbs" placeholder="Carbs (g)" min="0" required>
          <input type="number" id="fat" placeholder="Fat (g)" min="0" required>
          <button type="submit" class="btn primary full">Add Meal</button>
        </form>
        <p id="macroText" class="muted"></p>
      </article>

      <!-- BMI -->
      <article class="card">
        <h3>📏 BMI Calculator</h3>
        <div class="form-stack">
          <input type="number" id="height" placeholder="Height (cm)" min="50" max="250">
          <input type="number" id="bmiWeight" placeholder="Weight (kg)" min="20" max="300">
          <button id="bmiBtn" class="btn primary full">Calculate</button>
        </div>
        <p id="bmiResult" class="muted"></p>
      </article>

      <!-- 1RM -->
      <article class="card">
        <h3>💪 One-Rep Max</h3>
        <div class="form-stack">
          <input type="number" id="rmWeight" placeholder="Weight lifted (kg)" min="1">
          <input type="number" id="rmReps" placeholder="Reps performed" min="1" max="30">
          <button id="rmBtn" class="btn primary full">Estimate 1RM</button>
        </div>
        <p id="rmResult" class="muted"></p>
      </article>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
